name: ci
on:
  pull_request:
    branches: [main, develop]
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow boto3
      - run: python -m py_compile etl_s3.py